<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brett Rowley</title>
  <meta name="description" content="Brett Rowley: resume and personal side projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Favicons. favicon.ico and apple-touch-icon.png sit at the root so project sites
       (brettrowley.me/<repo>) pick them up automatically too. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="img/BR-favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Lets style.css hide things that animate in, only when JS is running to reveal them -->
  <script>document.documentElement.classList.add("js")</script>
</head>
<body>

  <main class="home">
    <div class="home__inner">

      <!-- Decorative collage from the LinkedIn banner, with the headshot in the middle.
           Empty alts: the name is the next thing read, so "Brett Rowley" twice adds nothing. -->
      <div class="collage" aria-hidden="true">
        <img class="illo illo--research"   src="img/illustration/01-research.webp"   alt="" width="560"  height="681">
        <img class="illo illo--code"       src="img/illustration/03-code.webp"       alt="" width="1000" height="648">
        <img class="illo illo--design"     src="img/illustration/02-design.webp"     alt="" width="1000" height="648">
        <img class="illo illo--production" src="img/illustration/04-production.webp" alt="" width="1000" height="648">
        <div class="headshot">
          <img src="img/Cleaned_Headshot.png" alt="" width="336" height="336">
        </div>
      </div>

      <header class="intro">
        <!-- The space before <br> makes screen readers say "Brett Rowley", not "BrettRowley" -->
        <h1 class="name"><span class="name__line">Brett</span> <br><span class="name__line">Rowley</span></h1>

        <h2 class="label" id="links-heading">Professional links</h2>
        <nav class="links" aria-labelledby="links-heading">
          <a href="https://www.linkedin.com/in/brett-rowley-boston/">LinkedIn</a>
          <a href="resume/brett-rowley-resume.pdf">Resume</a>
          <!-- Placeholder page lives at portfolio/ in this repo until the "portfolio" repo exists -->
          <a href="portfolio/">Portfolio</a>
        </nav>
      </header>

      <section class="projects" aria-labelledby="projects-heading" data-reveal>
        <h2 class="label" id="projects-heading">Personal projects</h2>
        <!-- One line per project repo. Later this becomes a loop over _data/projects.yml -->
        <ul class="project-list">
          <li><a href="caligari-title-cards/">Dr. Caligari Title Card Generator</a></li>
        </ul>
      </section>

    </div>
  </main>

  <script>
    // Motion timing only; the animations themselves live in style.css ("Motion").
    (() => {
      // Deal the illustration cards in as a set once all four images have
      // decoded, waiting at most 1.2s. A card whose image is still loading
      // then deals in by itself when it arrives, rather than popping in.
      const cards = [...document.querySelectorAll(".illo")];
      const loaded = cards.map(img =>
        Promise.resolve(img.decode && img.decode()).catch(() => {}));
      Promise.race([
        Promise.all(loaded),
        new Promise(done => setTimeout(done, 1200)),
      ]).then(() => {
        const start = performance.now();
        cards.forEach((img, i) => loaded[i].then(() => {
          if (performance.now() - start > 50) img.style.setProperty("--in-delay", "0ms");
          img.classList.add("is-in");
        }));
      });

      // Reveal [data-reveal] elements as they scroll into view. Anything
      // already on screen at load waits until the hero sequence is mostly
      // done (~1s after the first paint, when the CSS animations start);
      // items arriving together stagger 90ms apart.
      const reveal = (el, delay) => {
        el.style.setProperty("--reveal-delay", delay + "ms");
        el.classList.add("is-visible");
      };
      const items = document.querySelectorAll("[data-reveal]");
      if (!("IntersectionObserver" in window)) return items.forEach(el => reveal(el, 0));

      let firstPaint;   // the observer's first callback comes right after it
      const observer = new IntersectionObserver(entries => {
        firstPaint ??= performance.now();
        const wait = Math.max(0, 1000 - (performance.now() - firstPaint));
        entries.filter(e => e.isIntersecting).forEach((e, i) => {
          reveal(e.target, Math.round(wait + i * 90));
          observer.unobserve(e.target);
        });
      });
      items.forEach(el => observer.observe(el));
    })();
  </script>

</body>
</html>
